[package]
name = "chappa-ai-desktop"
version = "0.1.0"
description = "chappa-ai — terminal workspace for agents and dev processes"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
# The native folder picker behind `pick_directory`. Rust side ONLY —
# the npm package is deliberately NOT installed, so ipc.ts stays the single
# frontend Tauri surface.
tauri-plugin-dialog = "2"
# Process cpu/memory/child-tree sampling for `term://stats`. Only the
# `system` feature — the disk/network/component/user collectors are dead weight
# here and the poller must never do a full system scan (see stats.rs).
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
term-core = { path = "../term-core" }
project-model = { path = "../project-model" }
# The control surface's identity proof and the client that checks it are
# defined once, in the MCP crate; the app computes the same proof and reuses
# the checker to tell a live sibling instance from a stale endpoint file.
chappa-ai-mcp = { path = "../chappa-ai-mcp" }
# The secret-scan runner (gitleaks over a working tree, redacted findings,
# the local baseline) that gates every agent launch.
stack-core = { path = "../stack-core" }
indexmap = { version = "2", features = ["serde"] }
# The per-tool session-id capture pattern (`session_capture: regex`).
regex = "1"

# The debug-only HTTP server AND the all-builds control surface
# (control_http.rs on 8324) share this one server crate.
tiny_http = "0.12"
# The control bearer token (32 random bytes at first launch).
# Already in the dependency tree via tauri; a direct dep so the OS CSPRNG
# is reached without a hand-rolled mixer. `std` makes its error a
# `std::error::Error`, which the token code wraps in an `io::Error`.
getrandom = { version = "0.3", features = ["std"] }
# A source proves it holds its token with HMAC-SHA256 (sources.rs). Not
# BLAKE3 like the app's own control surface: a source is written in whatever
# language its author likes, and every mainstream standard library ships
# HMAC-SHA256 while none ships BLAKE3.
hmac = "0.12"
sha2 = "0.10"
# coordination.db (scratchpads + todos). `bundled` = no system sqlite
# on Windows; the file lives in the app-config dir next to settings.json.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
# Tempdir project roots + projects.json for the add-name tests.
tempfile = "3"

# `setsid` for the login-shell PATH read (login_path.rs). Already in the
# dependency tree.
[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_Memory", "Win32_Storage_FileSystem"] }
