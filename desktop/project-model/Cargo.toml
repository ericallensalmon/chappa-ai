[package]
name = "project-model"
version = "0.1.0"
description = "Project data model: per-project descriptor + stored projects"
edition = "2021"

# Container-testable core. NO tauri dependency — this crate must
# compile and test headless on Linux so it can be iterated on in-container
# (chappa-ai-desktop cannot: missing GTK headers). The src-tauri glue is thin and
# lives on top of this.

[dependencies]
globset = "0.4"
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
notify = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
term-core = { path = "../term-core" }
blake3 = "1"

[dev-dependencies]
tempfile = "3"
