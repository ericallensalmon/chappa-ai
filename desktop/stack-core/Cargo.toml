[package]
name = "stack-core"
version = "0.1.0"
description = "Per-slot development stacks: definition, planning, provenance and driver contracts"
edition = "2021"

# Pure core. NO tauri, tokio, HTTP or engine dependency — this crate must
# compile and test headless on Linux and Windows alike. Engines are CLIs
# that the drivers (built on these traits elsewhere) shell out to, argv
# only; nothing in here talks to one.

[dependencies]
blake3 = "1"
# The generated per-instance secrets (`{secret:<name>}`) come from the OS
# random source.
getrandom = "0.3"
indexmap = { version = "2", features = ["serde"] }
# Data-safety rule patterns: linear-time matching, because both the rules
# and the sampled values they run over are untrusted.
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# The stack definition trust hash; the app and the runner compute it alike.
sha2 = "0.10"
# The port probe binds without listening, so it never raises a firewall
# prompt; std has no bind-only socket.
socket2 = "0.6"
thiserror = "1"
# A project's own gitleaks config is checked (`[extend] useDefault`, no
# `[extend] path`) by parsing it, not by searching its text.
toml = "0.9"

[features]
# `test_support`: helpers for the tests of crates that depend on this one.
# Enable it from `[dev-dependencies]` only.
test-support = []

[dev-dependencies]
tempfile = "3"
