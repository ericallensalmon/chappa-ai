# The gitleaks config the app uses unless the user names one: gitleaks'
# own rules, plus rules for credentials written inline in commands. Agent
# CLIs store approved shell commands verbatim in local settings files, and
# those (`PGPASSWORD=...`, `curl -u user:pass`, an Authorization header, a
# URL with a password) are what the default rules most often miss.
#
# A value that is a placeholder ($VAR, ${VAR}, %VAR%, <...>, {...}, xxx,
# changeme) is allowed. Every value is redacted in reports.

title = "chappa"

[extend]
useDefault = true

[[rules]]
id = "inline-credential-assignment"
description = "A password, token, secret or API key assigned inline"
regex = '''(?i)\b[A-Z0-9_]*(?:PASSWORD|PASSWD|_TOKEN|_SECRET|_API_KEY)\s*=['"]?([^\s'"\\&;|)]+)'''
secretGroup = 1
keywords = ["password", "passwd", "_token", "_secret", "_api_key"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^\$''', '''^%[A-Za-z_][A-Za-z0-9_]*%$''', '''^<[^>]*>?$''', '''^\{''', '''^(?i)(?:x+|\*+|changeme|change_me|change-me)$''']

[[rules]]
id = "inline-authorization-header"
description = "An Authorization header written inline"
regex = '''(?i)authorization:\s*(?:bearer|basic)\s+([A-Za-z0-9._~+/=-]{4,})'''
secretGroup = 1
keywords = ["authorization"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^(?i)(?:x+|changeme|token|password)$''']

[[rules]]
id = "inline-user-password"
description = "A user:password pair passed with -u or --user"
regex = '''(?:^|[\s"'(])(?:-u|--user)(?:\s+|=)['"]?[^\s:'"]+:([^\s'"\\@)]+)'''
secretGroup = 1
keywords = ["-u", "--user"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^\$''', '''^%[A-Za-z_][A-Za-z0-9_]*%$''', '''^<''', '''^\{''', '''^(?i)(?:x+|\*+|changeme|password)$''']

[[rules]]
id = "inline-mysql-password"
description = "A MySQL password passed with -p or --password"
regex = '''(?i)\bmysql(?:dump|admin)?\b[^\n"]*?\s(?:-p|--password=)['"]?([^\s'"\\)-][^\s'"\\)]*)'''
secretGroup = 1
keywords = ["mysql"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^\$''', '''^%[A-Za-z_][A-Za-z0-9_]*%$''', '''^<''', '''^\{''', '''^(?i)(?:x+|\*+|changeme|password)$''']

[[rules]]
id = "inline-url-password"
description = "A URL with a user and password"
regex = '''(?i)\b[a-z][a-z0-9+.-]*://[^/\s:@'"]+:([^/\s@'"\\]+)@'''
secretGroup = 1
keywords = ["://"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^\$''', '''^%[A-Za-z_][A-Za-z0-9_]*%$''', '''^<''', '''^\{''', '''^(?i)(?:x+|\*+|changeme|password)$''']
