[package]
name = "chappa-stack"
version = "0.1.0"
description = "The stack runner as a source: serves the Environment view, runs stack verbs as jobs, relays ports"
edition = "2021"

[lib]
name = "chappa_stack"
path = "src/lib.rs"

[[bin]]
name = "chappa-stack"
path = "src/main.rs"

# std threads only, no async runtime: one small HTTP server (tiny_http), a
# background refresher, the relay listeners, and the job runner's pipe
# readers. Engines stay CLIs run argv-only through stack-core.
[dependencies]
stack-core = { path = "../stack-core" }
project-model = { path = "../project-model" }
# Where the app keeps its state (the platform folder or a profile): the
# runner reads and writes the gate records in the app's own storage there.
chappa-ai-mcp = { path = "../chappa-ai-mcp" }
# The batch-file argument rule panes use, so a job and a pane refuse the same
# characters (already built for project-model).
term-core = { path = "../term-core" }
tiny_http = "0.12"
# The identity proof the app checks before it sends the token.
hmac = "0.12"
sha2 = "0.10"
# Job ids and the token comparison's digests.
getrandom = "0.3"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The relay's peer check reads the interface that owns its gateway address
# (the address's on-link prefix) from the operating system's own table.
[target.'cfg(windows)'.dependencies]
# A job's step commands each run in a job object, so a timeout or a cancel
# ends the whole tree (children whose parent already exited included); a
# job's runner takes Ctrl+C in its terminal as a cancel.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Its `test_support` helpers: the shared gate storage the tests install.
stack-core = { path = "../stack-core", features = ["test-support"] }
