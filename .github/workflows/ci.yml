name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # These crates are headless — no webview libs needed.
      # src-tauri needs the platform webview libraries; it is exercised locally, not in CI.
      - run: cargo test -p term-core -p project-model -p chappa-ai-mcp
        working-directory: desktop

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - run: npm ci
        working-directory: desktop/ui
      - run: npm test
        working-directory: desktop/ui
